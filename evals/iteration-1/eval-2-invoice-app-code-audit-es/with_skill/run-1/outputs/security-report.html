ine":39,"scope":"app(environ, start)","description":"The route matches /invoices/\u003cid\u003e and takes invoice_id from the client-controlled last segment of PATH_INFO."},{"kind":"sink","file":"app.py","line":41,"scope":"app(environ, start)","description":"SELECT id, owner_id, customer, amount, iban FROM invoices WHERE id = ? runs with the id only, without binding owner_id to the authenticated user."}],"evidence":[{"file":"app.py","line":42,"description":"The query parameter is (invoice_id,); neither user[\"id\"] nor owner_id appears in the WHERE clause."},{"file":"app.py","line":48,"description":"The sibling route GET /invoices does apply WHERE owner_id = ? with (user[\"id\"],), evidencing the control that is absent on /invoices/\u003cid\u003e."},{"file":"seed.py","line":10,"description":"The invoices table defines owner_id and iban; ids are sequential INTEGER PRIMARY KEY values, so enumeration is trivial."}],"conditions":[{"kind":"authentication_level","description":"The attacker needs a valid session (any authenticated user); no administrative role is required."},{"kind":"data_state","description":"Invoices owned by other users exist; identifiers are sequential integers and enumerable."}],"execution":{"attacker_perspective":"A low-trust authenticated user (bob, id 2) who should only see his own invoices.","payloads":["GET /invoices/1 with Authorization: Bearer \u003cbob's token\u003e"],"instructions":["In a no-network sandbox (bwrap: read-only source, empty environment, writes only to scratch, CPU/memory/time limits), seed the database with seed.py (users alice id 1 and bob id 2).","Invoke the WSGI application in-process: POST /login with user=bob\u0026password=demo-password to obtain a token.","Call GET /invoices/1 presenting bob's token and observe the response."],"observed_result":"200 OK with {\"id\":1,\"owner_id\":1,\"customer\":\"Acme Ltd\",\"amount\":1200.0,\"iban\":\"DE00 0000 0000 0000 0000 01\"}: bob read alice's invoice, including the IBAN, although ection.execute runs a single statement, so full read (not chained write) of the data store was demonstrated.","root_cause":"SQL built by string concatenation with user-controlled input (q) instead of a parameterized query; furthermore the owner filter sits inside the same injectable statement and can be nullified.","intended_behavior":"All user input reaching the database must go through parameterized queries (? placeholders) so q cannot alter the statement structure or the owner_id predicate.","trace":[{"kind":"entrypoint","file":"app.py","line":52,"scope":"app(environ, start)","description":"q is taken from the client-controlled query string via parse_qs(QUERY_STRING)."},{"kind":"propagation","file":"app.py","line":53,"scope":"app(environ, start)","description":"q is interpolated into an f-string together with owner_id to form the SQL string."},{"kind":"sink","file":"app.py","line":55,"scope":"app(environ, start)","description":"db().execute(sql) runs the concatenated statement with no bound parameters."}],"evidence":[{"file":"app.py","line":53,"description":"sql = f\"SELECT id, customer, amount FROM invoices WHERE owner_id = {user['id']} AND customer LIKE '%{q}%'\": q enters with no escaping or parameter."},{"file":"app.py","line":55,"description":"db().execute(sql).fetchall(): the statement is executed as-is, with no parameter tuple."},{"file":"seed.py","line":9,"description":"The users table stores salt and pw_hash, reachable via UNION from the same connection."}],"conditions":[{"kind":"authentication_level","description":"Requires a valid session (any authenticated user) because /search sits behind the current_user check."},{"kind":"data_state","description":"Rows exist in invoices and users; the demonstration uses two dummy tenants."}],"execution":{"attacker_perspective":"A low-trust authenticated user who should only be able to search among his own invoices.","payloads":["GET /search?q=' OR 1=1 -- ","GET /search?q=' UNION SELECT id, username || ':' || hex(pw         sources: "Fuentes", verify: "Verificar tras corregir", verifyText: function (obs) { return "repite la reproducción; antes de corregir mostraba: " + obs + " — después no debe ocurrir."; },
        verifyFirst: "VERIFICAR PRIMERO", missing: "Dato que falta", check: "Comprobación", pkg: "Paquete", fixed: "Versiones corregidas", cvss: "CVSS"
      }
    }
  };
  var t = T[L];
  var SEV = ["critical", "high", "medium", "low", "informational"];
  var findings = Array.isArray(data.findings) ? data.findings : [];
  var confirmed = findings.filter(function (f) { return f && f.verdict === "confirmed"; });
  var needs = findings.filter(function (f) { return f && f.verdict === "needs_validation"; });
  var rejectedList = findings.filter(function (f) { return f && f.verdict === "rejected"; });
  var meta = data.metadata || {};
  confirmed.sort(function (a, b) { return SEV.indexOf(sev(a)) - SEV.indexOf(sev(b)) || String(a.fingerprint).localeCompare(String(b.fingerprint)); });

  function sev(f) { return (f.severity && f.severity.overall_severity) || "informational"; }
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function txt(v) { return v == null ? "" : String(v); }
  function badge(s) { return el("span", { class: "badge sev-" + s, text: t.sevNames[s] || s }); }
  function loc(e) { return txt(e.file) + ":" + txt(e.line); }
  function section(id, title) { var s = el("section", { id: id }); s.appendChild(el("h2", { text: title })); app.appendChild(s); return s; }
  function kv(pairs) {
    var dl = el("dl", { class: "kv" });
    pairs.forEach(function (p) { if (p[1] == null || p[1] === "") return; dl.appendChild(el("dt", { text: p[0] })); var dd = el("dd"); if (p[1] instanceof Node) dd.appendChild(p[1]); else dd.textContent = txt(p[1]); dl.appendChild(dd); });
    return dl;
  }
  function list(items, ordered) { var n = el(ordered ? "ol" : "ul"); items.forEach(function (i) { n.appendChild(el("li", { text: txt(i) })); }); return n; }
  function traceList(trace) {
    var ol = el("ol", { class: "trace" });
    (trace || []).forEach(function (s) { ol.appendChild(el("li", null, [el("code", { text: loc(s) }), " ", el("span", { class: "muted", text: "[" + txt(s.kind) + "] " + txt(s.scope) + " — " }), txt(s.description)])); });
    return ol;
  }
  function sourcesTable(sources) {
    if (!sources || !sources.length) return el("p", { class: "empty", text: t.none });
    var tb = el("tbody");
    sources.forEach(function (s) {
      var idCell = el("td", null, [el("code", { text: txt(s.id) })]);
      if (s.quote) idCell.appendChild(el("div", { class: "muted", text: "“" + txt(s.quote) + "”" }));
      tb.appendChild(el("tr", null, [
        el("td", { text: txt(s.standard) + " " + txt(s.version) + (s.tier === "B" ? " (tier B)" : "") }), idCell,
        el("td", { class: "src-relation", text: t.relNames[s.relation] || txt(s.relation) }),
        el("td", null, [el("code", { text: txt(s.file) })])
      ]));
    });
    return el("div", { class: "table-wrap" }, [el("table", null, [el("thead", null, [el("tr", null, [el("th", { text: t.standard }), el("th", { text: t.id }), el("th", { text: t.relation }), el("th", { text: t.file })])]), tb])]);
  }

  var app = document.getElementById("app");
  document.title = t.title + " — " + txt(meta.repo || "");

  // Header
  var themeBtn = el("button", { class: "theme-toggle", type: "button", "aria-label": t.theme, text: "◐ " + t.theme });
  themeBtn.addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  });
  var header = el("header", null, [themeBtn, el("h1", { text: t.title + (meta.repo ? " — " + meta.repo : "") })]);
  var m = el("div", { class: "meta" });
  [[t.ref, meta.source_ref], [t.date, data.generated], [t.profile, meta.profile], [t.modes, (meta.modes || []).join(" + ")],
   [t.scope, Array.isArray(meta.scope_paths) ? meta.scope_paths.join(", ") : meta.scope_paths], [t.status, meta.run_status]]
    .forEach(function (p) { if (p[1]) m.appendChild(el("span", null, [el("strong", { text: p[0] + ": " }), txt(p[1])])); });
  header.appendChild(m);
  app.appendChild(header);
  if (meta.independent_verification === false) app.appendChild(el("div", { class: "banner", text: t.notIndependent }));
  if (meta.run_status === "incomplete") app.appendChild(el("div", { class: "banner", text: t.incomplete + " " + txt(meta.incomplete_reason) }));
  if (meta.partial || meta.profile === "quick" || (meta.scope_paths && meta.scope_paths.length)) app.appendChild(el("div", { class: "banner", text: t.partial }));

  // Summary
  var sum = section("summary", t.summary);
  var cards = el("div", { class: "cards" });
  SEV.forEach(function (s) {
    var n = confirmed.filter(function (f) { return sev(f) === s; }).length;
    cards.appendChild(el("div", { class: "card" }, [el("div", { class: "n sev-" + s, text: String(n) }), el("div", { class: "l", text: t.confirmed + " · " + (t.sevNames[s] || s) })]));
  });
  cards.appendChild(el("div", { class: "card" }, [el("div", { class: "n", text: String(needs.length) }), el("div", { class: "l", text: t.needs })]));
  cards.appendChild(el("div", { class: "card" }, [el("div", { class: "n", text: String(rejectedList.length) }), el("div", { class: "l", text: t.rejected })]));
  sum.appendChild(cards);
  if (meta.posture) sum.appendChild(el("p", null, [el("strong", { text: t.posture + ": " }), txt(meta.posture)]));

  // Context
  if (meta.context && typeof meta.context === "object") {
    var ctx = section("context", t.context);
    ctx.appendChild(el("div", { class: "panel" }, [kv(Object.keys(meta.context).map(function (k) { var v = meta.context[k]; return [t.ctx[k] || k, Array.isArray(v) ? v.join("; ") : txt(v)]; }))]));
  }

  // Mitigation prompt
  var ps = section("prompt-section", t.prompt);
  var panel = el("div", { class: "panel" });
  panel.appendChild(el("p", { class: "muted", text: t.promptHelp }));
  var plist = el("div", { class: "prompt-list" });
  var boxes = [];
  function addBox(f, checked, pending) {
    var cb = el("input", { type: "checkbox" });
    cb.checked = checked;
    cb.addEventListener("change", buildPrompt);
    boxes.push({ cb: cb, f: f, pending: pending });
    var lab = el("label", null, [cb, pending ? el("span", { class: "badge", text: t.needs }) : badge(sev(f)), el("span", { text: txt(f.title) }), el("code", { class: "muted", text: txt(f.fingerprint) })]);
    plist.appendChild(lab);
  }
  if (confirmed.length) { plist.appendChild(el("h3", { text: t.promptConfirmed })); confirmed.forEach(function (f) { addBox(f, sev(f) === "critical", false); }); }
  if (needs.length) { plist.appendChild(el("h3", { class: "spaced", text: t.promptPending })); needs.forEach(function (f) { addBox(f, false, true); }); }
  if (!boxes.length) plist.appendChild(el("p", { class: "empty", text: t.none }));
  panel.appendChild(plist);
  var ta = el("textarea", { readonly: "readonly", "aria-label": t.prompt });
  var copyBtn = el("button", { type: "button", class: "btn-primary", text: t.copy });
  var status = el("div", { class: "copy-status", role: "status" });
  panel.appendChild(el("div", { class: "toolbar" }, [copyBtn, status]));
  panel.appendChild(ta);
  ps.appendChild(panel);

  function buildPrompt() {
    var P = t.p, sel = boxes.filter(function (b) { return b.cb.checked; });
    if (!sel.length) { ta.value = t.noneSelected; return; }
    var out = [P.intro(txt(meta.repo || "the repository"), txt(meta.source_ref || "")), "", P.rulesTitle];
    P.rules.forEach(function (r, i) { out.push((i + 1) + ". " + r); });
    out.push("", P.findingsTitle(sel.length));
    sel.forEach(function (b, i) {
      var f = b.f, n = i + 1;
      out.push("", n + ". " + (b.pending ? "[" + P.verifyFirst + "] " : "[" + (t.sevNames[sev(f)] || sev(f)).toUpperCase() + "] ") + txt(f.title) + "  (" + txt(f.fingerprint) + ")");
      if (f.package) out.push("   " + P.pkg + ": " + [f.package.ecosystem, f.package.name + "@" + f.package.version].join(" ") + (f.package.fixed_versions && f.package.fixed_versions.length ? " · " + P.fixed + ": " + f.package.fixed_versions.join(", ") : ""));
      if (f.trace && f.trace.length) out.push("   " + P.where + ": " + f.trace.map(function (s) { return loc(s) + " (" + txt(s.kind) + ")"; }).join(" → "));
      if (b.pending) {
        out.push("   " + P.root + ": " + txt(f.claimed_root_cause));
        (f.blockers || []).forEach(function (x) { out.push("   " + P.missing + ": " + txt(x)); });
        var plan = f.validation_plan || {};
        if (plan.local) out.push("   " + P.check + ": " + txt(plan.local));
        if (plan.deployment) out.push("   " + P.check + ": " + txt(plan.deployment));
      } else {
        out.push("   " + P.root + ": " + txt(f.root_cause));
        out.push("   " + P.invariant + ": " + txt(f.intended_behavior));
        if (f.remediation) {
          out.push("   " + P.fix + ": " + txt(f.remediation.strategy));
          var files = (f.remediation.code_changes || []).map(function (c) { return txt(c.file_name); });
          if (files.length) out.push("   " + P.files + ": " + files.join(", "));
        }
        if (f.cvss) out.push("   " + P.cvss + ": " + txt(f.cvss.nomenclature) + " " + txt(f.cvss.score) + " (" + txt(f.cvss.vector) + ")");
        if (f.execution && f.execution.observed_result) out.push("   " + P.verify + ": " + P.verifyText(txt(f.execution.observed_result)));
      }
      if (f.sources && f.sources.length) out.push("   " + P.sources + ": " + f.sources.map(function (s) { return txt(s.standard) + " " + txt(s.version) + " " + txt(s.id) + " (" + (t.relNames[s.relation] || s.relation) + ")"; }).join("; "));
    });
    ta.value = out.join("\n");
    status.textContent = "";
  }
  copyBtn.addEventListener("click", function () {
    var text = ta.value;
    function fallback() { ta.focus(); ta.select(); var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; } status.textContent = ok ? t.copied : t.copyFallback; }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { status.textContent = t.copied; }, fallback);
    else fallback();
  });
  buildPrompt();

  // Confirmed findings
  var fs = section("findings", t.findings);
  if (!confirmed.length) fs.appendChild(el("p", { class: "empty", text: t.none }));
  else {
    var tb = el("div", { class: "toolbar" });
    var current = "all";
    var search = el("input", { type: "search", placeholder: t.search, "aria-label": t.search });
    var filterBtns = [];
    ["all"].concat(SEV).forEach(function (s) {
      var n = s === "all" ? confirmed.length : confirmed.filter(function (f) { return sev(f) === s; }).length;
      if (s !== "all" && !n) return;
      var b = el("button", { type: "button", "aria-pressed": s === "all" ? "true" : "false", text: (s === "all" ? t.filterAll : t.sevNames[s]) + " (" + n + ")" });
      b.addEventListener("click", function () { current = s; filterBtns.forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); }); apply(); });
      filterBtns.push(b); tb.appendChild(b);
    });
    tb.appendChild(search);
    fs.appendChild(tb);
    var cardsEl = [];
    confirmed.forEach(function (f) {
      var d = el("details", { class: "finding" });
      d.appendChild(el("summary", null, [badge(sev(f)), el("h3", { text: txt(f.title) }), el("code", { class: "muted", text: txt(f.fingerprint) })]));
      var b = el("div", { class: "fbody" });
      b.appendChild(kv([[t.description, f.description], [t.rootCause, f.root_cause], [t.intended, f.intended_behavior],
        [t.category, f.category], [t.pkg, f.package ? f.package.ecosystem + " " + f.package.name + "@" + f.package.version : null],
        [t.cvss, f.cvss ? f.cvss.nomenclature + " " + f.cvss.score + " · " + f.cvss.severity + " · " + f.cvss.vector : null],
        [t.likelihood, f.severity && f.severity.likelihood ? f.severity.likelihood.score + " — " + f.severity.likelihood.reason : null],
        [t.impact, f.severity && f.severity.impact ? f.severity.impact.score + " — " + f.severity.impact.reason : null],
        [t.confidence, f.confidence ? f.confidence.score + " — " + f.confidence.reason : null]]));
      b.appendChild(el("h3", { text: t.sources })); b.appendChild(sourcesTable(f.sources));
      b.appendChild(el("h3", { text: t.trace })); b.appendChild(traceList(f.trace));
      if (f.evidence && f.evidence.length) { b.appendChild(el("h3", { text: t.evidence })); b.appendChild(list(f.evidence.map(function (e) { return loc(e) + " — " + txt(e.description); }))); }
      if (f.conditions && f.conditions.length) { b.appendChild(el("h3", { text: t.conditions })); b.appendChild(list(f.conditions.map(function (c) { return "[" + txt(c.kind) + "] " + txt(c.description); }))); }
      if (f.execution) {
        b.appendChild(el("h3", { text: t.reproduction }));
        var ex = f.execution;
        var pre = el("div");
        (ex.payloads || []).forEach(function (p) { pre.appendChild(el("pre", { text: txt(p) })); });
        b.appendChild(kv([[t.attacker, ex.attacker_perspective], [t.payloads, pre], [t.instructions, list(ex.instructions || [], true)], [t.result, ex.observed_result]]));
      }
      if (f.remediation) {
        b.appendChild(el("h3", { text: t.remediation }));
        b.appendChild(el("p", { text: txt(f.remediation.strategy) }));
        (f.remediation.code_changes || []).forEach(function (c) { b.appendChild(el("div", null, [el("code", { text: txt(c.file_name) }), el("pre", { text: txt(c.fixed_code) })])); });
      }
      d.appendChild(b);
      fs.appendChild(d);
      cardsEl.push({ d: d, f: f, hay: JSON.stringify(f).toLowerCase() });
    });
    function apply() {
      var q = search.value.trim().toLowerCase();
      cardsEl.forEach(function (c) { c.d.hidden = !((current === "all" || sev(c.f) === current) && (!q || c.hay.indexOf(q) >= 0)); });
    }
    search.addEventListener("input", apply);
  }

  // Needs validation
  var ns = section("needs-validation", t.needsTitle);
  if (!needs.length) ns.appendChild(el("p", { class: "empty", text: t.none }));
  needs.forEach(function (f) {
    var d = el("details", { class: "finding" });
    d.appendChild(el("summary", null, [el("span", { class: "badge", text: t.needs }), el("h3", { text: txt(f.title) }), el("code", { class: "muted", text: txt(f.fingerprint) })]));
    var b = el("div", { class: "fbody" });
    var plan = f.validation_plan || {};
    b.appendChild(kv([[t.description, f.description], [t.claimed, f.claimed_root_cause],
      [t.pkg, f.package ? f.package.ecosystem + " " + f.package.name + "@" + f.package.version + (f.package.fixed_versions ? " → " + f.package.fixed_versions.join(", ") : "") : null],
      [t.blockers, list(f.blockers || [])], [t.planLocal, plan.local], [t.planDeployment, plan.deployment]]));
    b.appendChild(el("h3", { text: t.sources })); b.appendChild(sourcesTable(f.sources));
    b.appendChild(el("h3", { text: t.trace })); b.appendChild(traceList(f.trace));
    d.appendChild(b);
    ns.appendChild(d);
  });

  // Hardening notes
  var notes = Array.isArray(meta.hardening_notes) ? meta.hardening_notes : [];
  if (notes.length) { var hs = section("hardening", t.hardening); hs.appendChild(el("div", { class: "panel" }, [list(notes)])); }

  // Coverage
  var ledger = Array.isArray(data.ledger) ? data.ledger : [];
  if (ledger.length) {
    var cs = section("coverage", t.coverage);
    var counts = {};
    ledger.forEach(function (u) { counts[u.status] = (counts[u.status] || 0) + 1; });
    var cc = el("div", { class: "cards" });
    Object.keys(counts).sort().forEach(function (k) { cc.appendChild(el("div", { class: "card" }, [el("div", { class: "n", text: String(counts[k]) }), el("div", { class: "l", text: k })])); });
    cs.appendChild(cc);
    var det = el("details", { class: "finding" }, [el("summary", null, [el("h3", { text: t.units + " (" + ledger.length + ")" })])]);
    var tbody = el("tbody");
    ledger.forEach(function (u) { tbody.appendChild(el("tr", null, [el("td", { text: txt(u.status) }), el("td", { text: txt(u.surface) }), el("td", { text: txt(u.boundary) }), el("td", { text: txt(u.attack_class) }), el("td", { text: (u.unresolved || []).join("; ") })])); });
    det.appendChild(el("div", { class: "fbody" }, [el("div", { class: "table-wrap" }, [el("table", null, [el("thead", null, [el("tr", null, ["status", "surface", "boundary", "attack class", "unresolved"].map(function (h) { return el("th", { text: h }); }))]), tbody])])]));
    cs.appendChild(det);
  }

  // Rejected
  if (rejectedList.length) {
    var rs = section("rejected", t.rejectedTitle);
    var rd = el("details", { class: "finding" }, [el("summary", null, [el("h3", { text: t.rejectedTitle + " (" + rejectedList.length + ")" })])]);
    rd.appendChild(el("div", { class: "fbody" }, [list(rejectedList.map(function (f) { return txt(f.fingerprint) + " — " + txt(f.title) + ": " + txt(f.reason); }))]));
    rs.appendChild(rd);
  }

  app.appendChild(el("footer", null, [el("p", { text: t.limits }), el("p", { text: t.generated })]));
})();
