name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # quickjs runs FIRST's CVSS calculator and the report's page script in the tests; nothing else is needed.
      - run: python -m pip install quickjs==1.19.4
      - run: python -m unittest discover -s tests -v
      - run: python skills/security/cybersec-skill/scripts/verify_ids.py
      - run: |
          python -m json.tool .claude-plugin/plugin.json > /dev/null
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
